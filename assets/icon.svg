<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" rx="60" fill="url(#gradient)"/>
  
  <!-- Main Circle -->
  <circle cx="128" cy="128" r="90" fill="white" opacity="0.1"/>
  
  <!-- Target Symbol -->
  <circle cx="128" cy="128" r="70" fill="none" stroke="white" stroke-width="8"/>
  <circle cx="128" cy="128" r="45" fill="none" stroke="white" stroke-width="6"/>
  <circle cx="128" cy="128" r="20" fill="white"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
