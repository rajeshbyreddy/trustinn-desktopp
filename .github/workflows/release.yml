name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: x64
            target: dmg
            artifact_name: '*.dmg'
          - os: windows-latest
            arch: x64
            target: nsis
            artifact_name: '*.exe'

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run prebuild:nextjs

      - name: Build Electron app and package
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          # Copy DMG files
          find dist -name "*.dmg" -o -name "*-mac.zip" | xargs -I {} cp {} release-artifacts/ 2>/dev/null || true
          # Copy EXE files
          find dist -name "*.exe" -o -name "*-nsis-setup.exe" | xargs -I {} cp {} release-artifacts/ 2>/dev/null || true
          # Copy generic zips
          find dist -name "*.zip" | xargs -I {} cp {} release-artifacts/ 2>/dev/null || true
          ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

